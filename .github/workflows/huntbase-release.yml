# Huntbase fork only: build patched connector wheels and publish them as
# GitHub release assets for hb-backend to install. Not for upstream.
#
# Release by pushing a tag `hb-<module>-<version>`, e.g. `hb-splunk-8.1.2.post1`,
# on a commit already merged to `huntbase` (by PR), or run the workflow
# manually from `huntbase`. Commits not on `huntbase` are refused, and
# `hb-*` tags can't be moved or deleted (repo ruleset). Use a PEP 440 post-release of the upstream
# version hb-backend pins so the patched wheel sorts above the stock one.
name: Huntbase release

on:
  push:
    tags:
      - 'hb-*'
  workflow_dispatch:
    inputs:
      module:
        description: Connector module to build (directory under stix_shifter_modules)
        required: true
        default: splunk
      version:
        description: Wheel version, e.g. 8.1.2.post1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only release reviewed code: the tagged (or dispatched) commit must
      # already be on the protected `huntbase` branch.
      - name: Check the commit is merged to huntbase
        run: |
          git fetch --no-tags origin huntbase
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/huntbase; then
            echo "::error::${GITHUB_SHA} is not on huntbase. Merge the change by PR first, then tag the merge commit."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve module and version
        id: meta
        env:
          INPUT_MODULE: ${{ inputs.module }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # hb-<module>-<version>; module names use underscores, never hyphens
            rest="${GITHUB_REF_NAME#hb-}"
            module="${rest%%-*}"
            version="${rest#*-}"
            tag="${GITHUB_REF_NAME}"
          else
            module="${INPUT_MODULE}"
            version="${INPUT_VERSION}"
            tag="hb-${module}-${version}"
          fi
          if [ ! -d "stix_shifter_modules/${module}" ]; then
            echo "::error::Unknown module '${module}'"; exit 1
          fi
          echo "module=${module}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python generate_requirements.py
          pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      # Full suite, not just the module: shared tests (e.g. common labels)
      # catch changes that break other connectors.
      - name: Test
        run: pytest -q

      - name: Build wheel
        env:
          MODE: ${{ steps.meta.outputs.module }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python -m build_tools.run_build
          cd dist && sha256sum *.whl | tee SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          MODULE: ${{ steps.meta.outputs.module }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "$TAG" dist/*.whl dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "stix-shifter-modules-${MODULE} ${VERSION} (Huntbase)" \
            --notes "Patched \`stix-shifter-modules-${MODULE}\` wheel built from ${GITHUB_SHA}. See the commits on the \`huntbase\` branch for the changes against upstream."
